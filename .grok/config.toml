# Best-effort Grok Build permission translation from .claude/settings.json.
# Verify the effective interpretation with `grok inspect` before relying on it.
[permissions]
default = "ask"
deny_precedence = true

[[permissions.rules]]
name = "deny-recursive-force-delete"
tool = "Bash"
action = "deny"
pattern = '''(?:^|[;&|\n][ \t\r\f\v]*|\$\([ \t\r\f\v]*|`[ \t\r\f\v]*)rm[ \t]+-rf(?=$|[ \t\r\n;&|)]|\$\(|`)'''

[[permissions.rules]]
name = "deny-hook-bypass"
tool = "Bash"
action = "deny"
pattern = '''(?:^|[ \t\r\n;&|]|\$\([ \t\r\f\v]*|`[ \t\r\f\v]*)--no-verify(?=$|[ \t\r\n;&|)]|\$\(|`)'''

[[permissions.rules]]
name = "deny-codex-network-search"
tool = "Bash"
action = "deny"
pattern = '''(?:^|[;&|\n][ \t\r\f\v]*|\$\([ \t\r\f\v]*|`[ \t\r\f\v]*)codex(?:[ \t]+\S+)*[ \t]+--search(?=$|[ \t\r\n;&|)]|\$\(|`)'''

[[permissions.rules]]
name = "deny-codex-sandbox-bypass"
tool = "Bash"
action = "deny"
pattern = '''(?:^|[;&|\n][ \t\r\f\v]*|\$\([ \t\r\f\v]*|`[ \t\r\f\v]*)codex(?:[ \t]+\S+)*[ \t]+--dangerously-bypass-approvals-and-sandbox(?=$|[ \t\r\n;&|)]|\$\(|`)'''

[[permissions.rules]]
name = "allow-git-status"
tool = "Bash"
action = "allow"
pattern = '''^\s*git\s+status(?:\s|$)'''

